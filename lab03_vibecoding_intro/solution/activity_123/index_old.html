<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grocery Prices — Multi-Store Line Chart</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --ink: #e7eef8;
    --muted: #9fb2c8;
    --grid: #243042;
    --accent: #6ea8fe;
    --chip: #1a2331;
    --chip-border: #2a3a50;
  }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    color: var(--ink);
    background: radial-gradient(1200px 800px at 80% -20%, #1b2230 0%, #0b0f14 60%);
  }
  .wrap {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 16px 32px;
  }
  header h1 {
    font-size: 24px;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }
  header p {
    color: var(--muted);
    margin: 0 0 16px;
    line-height: 1.4;
  }
  .panel {
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border: 1px solid #1f2a3a;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 720px) {
    .controls {
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
    }
  }
  .control-group {
    display: grid;
    gap: 8px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
  }
  select, .stores {
    background: var(--panel);
    border: 1px solid var(--chip-border);
    border-radius: 12px;
    padding: 10px;
    color: var(--ink);
    outline: none;
  }
  select {
    width: 100%;
    appearance: none;
  }
  .stores {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
  }
  .store-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    padding: 8px 10px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s ease;
  }
  .store-chip input {
    accent-color: var(--accent);
  }
  .store-chip:hover { transform: translateY(-1px); }
  .chart-wrap {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid #1f2a3a;
    border-radius: 16px;
    padding: 10px;
  }
  svg {
    width: 100%;
    height: 540px;
    display: block;
  }
  .axis path, .axis line {
    stroke: var(--grid);
  }
  .axis text {
    fill: var(--muted);
    font-size: 12px;
  }
  .grid line {
    stroke: var(--grid);
    stroke-dasharray: 2 4;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    margin-top: 8px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--chip-border);
    background: var(--chip);
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.5);
  }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #0e141d;
    border: 1px solid #28374d;
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 12px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 120ms ease, transform 120ms ease;
    white-space: nowrap;
  }
  .notice {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--chip-border);
    background: var(--chip);
    color: var(--muted);
    font-size: 11px;
    margin-left: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Grocery Price Comparison</h1>
    <p>Compare prices for five items across stores in 2010, 2016, 2022, and 2025. Hover points for details.</p>
  </header>

  <div class="panel">
    <div class="controls">
      <div class="control-group">
        <label for="itemSelect">Grocery item</label>
        <select id="itemSelect" aria-label="Select grocery item">
          <option>Aluminum Foil</option>
          <option>Apple Juice</option>
          <option>Apple Sauce</option>
          <option>Bacon</option>
          <option>Bagles</option>
        </select>
      </div>
      <div class="control-group">
        <label>Stores <span class="badge">toggle to include/exclude</span></label>
        <div class="stores" id="storeToggles">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>

    <div class="chart-wrap">
      <svg id="chart" role="img" aria-label="Line chart comparing store prices over years"></svg>
    </div>
    <div class="legend" id="legend"></div>
    <div class="notice" id="notice"></div>
  </div>
</div>

<div class="tooltip" id="tooltip" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
(async function () {
  const YEARS = [2010, 2016, 2022, 2025];
  const ITEMS = ["Aluminum Foil", "Apple Juice", "Apple Sauce", "Bacon", "Bagles"];
  const ALT_SPELLINGS = { "Bagles": ["Bagels"] }; // fallback search if CSV uses common spelling
  const STORES = [
    { key: "Aldi", col: "Aldi.Price" },
    { key: "Kroger", col: "Kroger.Price" },
    { key: "Trader Joe's", col: "Trader Joe's.Price" },
    { key: "Publix", col: "Publix.Price" },
    { key: "Walmart", col: "Walmart.Price" },
  ];

  // Store colors — stable & distinct
  const color = d3.scaleOrdinal()
    .domain(STORES.map(s => s.key))
    .range(["#6ea8fe", "#62d2a2", "#ffb86b", "#ff6e9a", "#caa2ff"]);

  // UI refs
  const svg = d3.select("#chart");
  const itemSelect = document.getElementById("itemSelect");
  const storeToggles = document.getElementById("storeToggles");
  const legend = document.getElementById("legend");
  const tooltip = document.getElementById("tooltip");
  const notice = document.getElementById("notice");

  // Build store toggles
  const enabledStores = new Set(STORES.map(s => s.key));
  function renderStoreToggles() {
    storeToggles.innerHTML = "";
    STORES.forEach(s => {
      const label = document.createElement("label");
      label.className = "store-chip";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = enabledStores.has(s.key);
      input.addEventListener("change", () => {
        if (input.checked) enabledStores.add(s.key); else enabledStores.delete(s.key);
        draw();
      });
      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = color(s.key);
      const text = document.createElement("span");
      text.textContent = s.key;
      label.appendChild(input);
      label.appendChild(swatch);
      label.appendChild(text);
      storeToggles.appendChild(label);
    });
  }
  renderStoreToggles();

  // Build legend
  function renderLegend(activeStores) {
    legend.innerHTML = "";
    activeStores.forEach(sname => {
      const li = document.createElement("div");
      li.className = "legend-item";
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = color(sname);
      const txt = document.createElement("span");
      txt.textContent = sname;
      li.appendChild(sw);
      li.appendChild(txt);
      legend.appendChild(li);
    });
  }

  // Parse a currency like "$2.29" or "2.29" → number
  const parsePrice = (v) => {
    if (v == null) return NaN;
    const s = String(v).replace(/[^0-9.\-]/g, "");
    const n = parseFloat(s);
    return isNaN(n) ? NaN : n;
  };

  // Load CSV
  let rows;
  try {
    rows = await d3.csv("groceries_all.csv");
  } catch (e) {
    notice.innerHTML = "Could not load <code>groceries_all.csv</code>. If opening this file directly, start a local server (e.g., <code>python -m http.server</code>) so the browser can fetch the CSV.";
    throw e;
  }

  // Normalize Year to number
  rows.forEach(r => { if (r.Year) r.Year = +r.Year; });

  // Helper: find rows for a specific item, with fallback spellings
  function rowsForItem(item) {
    const base = rows.filter(r => (r.Product || "").trim().toLowerCase() === item.toLowerCase());
    if (base.length) return base;
    const alts = ALT_SPELLINGS[item] || [];
    for (const alt of alts) {
      const altMatches = rows.filter(r => (r.Product || "").trim().toLowerCase() === alt.toLowerCase());
      if (altMatches.length) return altMatches;
    }
    return base; // may be empty
  }

  // Prepare chart scaffolding
  const margin = { top: 26, right: 24, bottom: 46, left: 64 };
  function getInnerSize() {
    const { width, height } = svg.node().getBoundingClientRect();
    const W = Math.max(640, width);
    const H = Math.max(380, height);
    return { W, H, iw: W - margin.left - margin.right, ih: H - margin.top - margin.bottom };
  }

  const gRoot = svg.append("g").attr("class", "root");

  // Draw function
  function draw() {
    const chosen = itemSelect.value;
    const itemRows = rowsForItem(chosen).filter(r => YEARS.includes(+r.Year));

    // Build series data per store
    const activeStores = STORES.map(s => s.key).filter(k => enabledStores.has(k));
    renderLegend(activeStores);

    const series = activeStores.map(storeName => {
      const col = STORES.find(s => s.key === storeName).col;
      const points = YEARS.map(Y => {
        const row = itemRows.find(r => +r.Year === Y);
        const val = row ? parsePrice(row[col]) : NaN;
        return { year: Y, value: val, store: storeName, product: chosen };
      });
      return { store: storeName, points };
    });

    // Compute Y domain from available values
    const allVals = series.flatMap(s => s.points.map(p => p.value)).filter(v => !isNaN(v));
    const yMax = Math.ceil((d3.max(allVals) || 10) * 1.15 * 100) / 100;
    const yMin = 0;

    // Clear & redraw
    gRoot.selectAll("*").remove();
    const { W, H, iw, ih } = getInnerSize();
    svg.attr("viewBox", `0 0 ${W} ${H}`);

    const g = gRoot.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    // Scales
    const x = d3.scaleLinear()
      .domain(d3.extent(YEARS))  // [2010, 2025]
      .range([0, iw]);

    // Update axis call to use a reasonable tick format:
    g.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${ih})`)
      .call(d3.axisBottom(x).tickFormat(d3.format("d"))); // ensures 2010 not 2.01e3
      
    const y = d3.scaleLinear().domain([yMin, yMax]).range([ih, 0]).nice();

    // Grid
    g.append("g")
      .attr("class", "grid")
      .call(d3.axisLeft(y).tickSize(-iw).tickFormat("").ticks(6))
      .selectAll("line").attr("opacity", 0.7);

    // Axes
    g.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${ih})`)
      .call(d3.axisBottom(x).tickValues(YEARS));

    g.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y).ticks(6).tickFormat(d => "$" + d.toFixed(2)));

    // Axis titles
    g.append("text")
      .attr("x", iw / 2)
      .attr("y", ih + 36)
      .attr("text-anchor", "middle")
      .attr("fill", "#b9c8dc")
      .attr("font-size", 12)
      .text("Year");

    g.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -ih / 2)
      .attr("y", -46)
      .attr("text-anchor", "middle")
      .attr("fill", "#b9c8dc")
      .attr("font-size", 12)
      .text("Price (USD)");

    // Line generator (skip missing points)
    const line = d3.line()
      .defined(d => !isNaN(d.value))
      .x(d => x(d.year))
      .y(d => y(d.value))
      .curve(d3.curveCatmullRom.alpha(0.4));

    // Draw lines
    const seriesG = g.append("g").attr("class", "series");
    series.forEach(s => {
      seriesG.append("path")
        .datum(s.points)
        .attr("fill", "none")
        .attr("stroke", color(s.store))
        .attr("stroke-width", 2.5)
        .attr("d", line);
    });

    // Points & tooltips
    const pointG = g.append("g");
    series.forEach(s => {
      pointG.selectAll(`.pt-${cssSafe(s.store)}`)
        .data(s.points.filter(p => !isNaN(p.value)))
        .enter()
        .append("circle")
        .attr("r", 4.5)
        .attr("cx", d => x(d.year))
        .attr("cy", d => y(d.value))
        .attr("fill", color(s.store))
        .attr("stroke", "rgba(10,10,10,0.5)")
        .attr("stroke-width", 1)
        .on("mouseenter", (event, d) => showTip(event, d))
        .on("mouseleave", hideTip)
        .on("mousemove", (event, d) => moveTip(event, d));
    });

    // Title inside chart
    g.append("text")
      .attr("x", 0)
      .attr("y", -8)
      .attr("fill", "#c9d7ea")
      .attr("font-size", 14)
      .attr("font-weight", 600)
      .text(`${chosen} — Prices by store`);

    // Notice about missing data
    const missing = [];
    series.forEach(s => {
      YEARS.forEach(Y => {
        const p = s.points.find(pp => pp.year === Y);
        if (!p || isNaN(p.value)) missing.push(`${s.store} ${Y}`);
      });
    });
    if (missing.length) {
      notice.innerHTML = `Missing data for: ${missing.slice(0, 6).join(", ")}${missing.length > 6 ? "…" : ""}`;
    } else {
      notice.textContent = "";
    }
  }

  function cssSafe(s) {
    return s.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  }

  function showTip(evt, d) {
    tooltip.style.opacity = 1;
    tooltip.style.transform = "translateY(0)";
    moveTip(evt, d);
  }
  function moveTip(evt, d) {
    const price = "$" + d.value.toFixed(2);
    tooltip.innerHTML = `<b>${d.product}</b><br>${d.store} — ${d.year}<br><b>${price}</b>`;
    const pad = 12;
    const x = evt.clientX + pad;
    const y = evt.clientY + pad;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
    tooltip.setAttribute("aria-hidden", "false");
  }
  function hideTip() {
    tooltip.style.opacity = 0;
    tooltip.style.transform = "translateY(-6px)";
    tooltip.setAttribute("aria-hidden", "true");
  }

  // Respond to controls
  itemSelect.addEventListener("change", draw);
  window.addEventListener("resize", draw);

  // Initial render
  draw();
})();
</script>
</body>
</html>
